# «Сільпо: Сімейна комора» — прототип хакатону.
# Слухає ЛИШЕ 127.0.0.1: назовні застосунок публікує Cloudflare Tunnel.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: silpo-pantry:latest
    container_name: silpo-pantry
    restart: unless-stopped
    # 8093 — перший вільний порт у ряду im.pl.ua (8090–8092 зайняті)
    ports:
      - "127.0.0.1:8093:3000"
    # .env лежить у корені застосунку, а compose — у deploy/.
    # Без явного env_file Compose шукав би .env поруч із собою й мовчки
    # передав би в контейнер порожні значення: саме так SESSION_SECRET
    # виявився незаданим на публічній адресі.
    env_file:
      - ../.env
    # Тільки те, що має ПЕРЕВИЗНАЧАТИ .env: шляхи всередині контейнера.
    # Решта змінних приходить із env_file — не дублюємо їх тут, інакше
    # порожня змінна оболонки затре справжнє значення з файлу.
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/prod.db
    volumes:
      # БД переживає перезбірку образу; це єдиний стан застосунку
      - silpo-pantry-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  silpo-pantry-data:
