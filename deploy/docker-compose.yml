# «Сільпо: Сімейна комора» — прототип хакатону.
# Слухає ЛИШЕ 127.0.0.1: назовні застосунок публікує Cloudflare Tunnel.
#
# `name` ОБОВʼЯЗКОВИЙ: без нього compose бере імʼя проєкту з назви теки
# (`deploy`), а таких тек на сервері кілька — 26.08.2026 up сусіднього
# MetroPantry мовчки зніс цей контейнер, бо для compose обидва були
# «одним проєктом deploy» з одним сервісом app.
name: silpo-pantry

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: silpo-pantry:latest
    container_name: silpo-pantry
    restart: unless-stopped
    # 8093 — перший вільний порт у ряду im.pl.ua (8090–8092 зайняті)
    ports:
      - "127.0.0.1:8093:3000"
    # .env лежить у корені застосунку, а compose — у deploy/.
    # Без явного env_file Compose шукав би .env поруч із собою й мовчки
    # передав би в контейнер порожні значення: саме так SESSION_SECRET
    # виявився незаданим на публічній адресі.
    env_file:
      - ../.env
    # Тільки те, що має ПЕРЕВИЗНАЧАТИ .env: шляхи всередині контейнера.
    # Решта змінних приходить із env_file — не дублюємо їх тут, інакше
    # порожня змінна оболонки затре справжнє значення з файлу.
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/prod.db
    volumes:
      # БД переживає перезбірку образу; це єдиний стан застосунку
      - silpo-pantry-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Дані створені, коли проєкт ще звався `deploy` (див. `name` вгорі), тому
  # справжнє імʼя volume — deploy_silpo-pantry-data. Фіксуємо його явно, щоб
  # зміна імені проєкту не відвʼязала наявну БД. external: compose цей volume
  # не створює й не видаляє (не зачепить навіть `down -v`); на новому сервері
  # спершу `docker volume create deploy_silpo-pantry-data`.
  #
  # Перший up після цієї зміни: старий контейнер ще належить проєктові
  # `deploy` і тримає імʼя silpo-pantry, тому одноразово перед ним —
  #   docker compose -p deploy down   # саме БЕЗ -v, бо -v видалить БД
  silpo-pantry-data:
    external: true
    name: deploy_silpo-pantry-data
